org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 编译跑在**另一个 JVM**(Kotlin daemon)里,上面那个 -Xmx4g 给的是 Gradle daemon,
# 管不到它。不显式给堆时它用自己的默认值,大项目上会 GC 抖 —— 表现是占着一个核不放、
# 整体很慢,而不是报内存不足。
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# iOS target 只能在 macOS 宿主上编译。Windows/Linux 上 Gradle 会为每个 Apple target 各报一条
# "task disabled" 警告 —— 那是预期行为,不是配置错误,压掉以免真正的警告被淹掉。
# 代价:iOS 的编译产物只在 macOS(CI)上才真的被验证过。
kotlin.native.ignoreDisabledTargets=true
